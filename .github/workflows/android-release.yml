name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
  GODOT_VERSION: "4.8"

jobs:
  android-release:
    name: Export release APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Godot home and Android SDK
        shell: sh
        run: |
          set -eu
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          if [ ! -d "$HOME/.config/godot" ] && [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot "$HOME/.config/godot"
          fi
          TEMPLATE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -d "$DEST" ] && [ -d "$TEMPLATE" ]; then
            cp -a "$TEMPLATE" "$DEST"
          fi
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKM="sdkmanager"
          fi
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.1.0"
          ZIP="$DEST/android_source.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Missing Android source template: $ZIP" >&2
            ls -la "$DEST" >&2 || true
            exit 1
          fi
          rm -rf godot/android
          mkdir -p godot/android/build
          if command -v unzip >/dev/null 2>&1; then
            unzip -q -o "$ZIP" -d godot/android/build
          else
            python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$ZIP" godot/android/build
          fi
          if [ -f godot/android/build/build/build.gradle ]; then
            mv godot/android/build/build godot/android/build.tmp
            rm -rf godot/android/build
            mv godot/android/build.tmp godot/android/build
          elif [ -f godot/android/build/android/build/build.gradle ]; then
            mv godot/android/build/android/build godot/android/build.tmp
            rm -rf godot/android/build
            mv godot/android/build.tmp godot/android/build
          fi
          if [ ! -f godot/android/build/build.gradle ]; then
            echo "Android source template did not contain build.gradle" >&2
            find godot/android -name build.gradle -o -type d | head -50 >&2
            exit 1
          fi
          SETTINGS="$HOME/.config/godot/editor_settings-4.8.tres"
          if [ ! -f "$SETTINGS" ] || ! grep -q 'export/android/java_sdk_path' "$SETTINGS"; then
            mkdir -p "$HOME/.config/godot"
            if [ ! -f "$SETTINGS" ]; then
              printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' > "$SETTINGS"
            fi
            printf 'export/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "/root/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' \
              "$JAVA_HOME" "$ANDROID_HOME" >> "$SETTINGS"
          fi
          printf '%s\n' "${GODOT_VERSION}.stable" > godot/android/.build_version

      - name: Import project
        working-directory: godot
        run: godot --headless --import

      - name: Export release APK
        working-directory: godot
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /usr/lib/android-sdk
        run: |
          mkdir -p build
          godot --headless --verbose --export "Android" "build/dino-kazi-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dino-kazi-release-apk
          path: godot/build/dino-kazi-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: godot/build/dino-kazi-release.apk
          tag_name: ${{ github.ref_name }}
          name: "Dino Kazı ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: godot/build/dino-kazi-release.apk
          tag_name: ${{ github.event.inputs.version }}
          name: "Dino Kazı ${{ github.event.inputs.version }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}