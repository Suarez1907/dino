name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  android-debug:
    name: Export debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Godot home and Android SDK
        run: |
          set -euo pipefail
          if [ "$(id -u)" != "0" ]; then
            mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
            cp -a /root/.config/godot "$HOME/.config/godot"
            cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
              "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          fi
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKM="sdkmanager"
          fi
          yes | "$SDKM" --licenses >/dev/null || true
          # Godot 4.7's Gradle template compiles against API 36.
          # minSdk 24 and targetSdk 35 come from export_presets.cfg.
          "$SDKM" "platforms;android-36" "build-tools;36.1.0"

      - name: Import project
        working-directory: godot
        run: godot --headless --import

      - name: Export debug APK
        working-directory: godot
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /usr/lib/android-sdk
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" "build/dino-kazi-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dino-kazi-debug-apk
          path: godot/build/dino-kazi-debug.apk
          if-no-files-found: error
