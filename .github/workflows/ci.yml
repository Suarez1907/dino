name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        run: |
          echo "=== STEP: import project ==="
          timeout 300 godot --headless --path godot --import || true

      - name: Run features test
        run: |
          echo "=== STEP: run_features ==="
          timeout 180 godot --headless --path godot --script res://tests/run_features.gd

      - name: Run other headless tests
        run: |
          echo "=== STEP: run_other_tests ==="
          timeout 180 godot --headless --path godot --script res://tests/run_tests.gd

      - name: Build level database
        run: |
          echo "=== STEP: level_database_builder ==="
          timeout 180 godot --headless --path godot --script res://tools/level_database_builder.gd
